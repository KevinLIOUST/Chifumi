<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chifumi</title>

    <!-- Lien vers Bootstrap -->
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css">

    <!-- Lien vers les icônes Bootstrap -->
    <!-- <link rel="stylesheet" href="/node_modules/bootstrap-icons/font/bootstrap-icons.min.css"> -->

    <!-- Lien pour utiliser JavaScript pour les actions de l'utilisateur -->
    <script src="/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="d-block">

    <!-- Pour le header -->
    <header class="d-flex justify-content-center p-3">
        <h1 class="mx-auto ms-auto text-white">FairyTail Version Chifumi</h1>
    </header>

    <!-- Pour le contenu principal de la page -->
    <main class="p-3">
        <div class="d-flex justify-content-center m-3">
            <h2 class="m-3 text-white">Veuillez choisir une action :</h2>
        </div>

        <!-- Version Desktop -->
        <div class=" text-center m-3">

            <!-- <button class=" m-3" onclick="jouerAction('Pierre')">Pierre</button> -->
            <img class="text-white m-3" onclick="jouerAction('Acier')" src="img/Gajeel_Redfox_2.png"
                alt="Gajeel_Redfox_2.png">

            <!-- <button class="m-3" onclick="jouerAction('Feuille')">Feuille</button> -->
            <img class="text-white m-3" onclick="jouerAction('Feu')" src="img/natsu_dragnir_3.png"
                alt="natsu_dragnir_3.png">

            <!-- <button class="m-3" onclick="jouerAction('Ciseaux')">Ciseaux</button> -->
            <img class="text-white m-3" onclick="jouerAction('Glace')" src="img/Gray_Fullbuster_2.png"
                alt="Gray_Fullbuster_2.png">

        </div>

        <div class="d-flex justify-content-center m-3">
            <p id="resultat" class="text-white">Résultat</p>
        </div>

        <div class="d-block text-center m-3">
            <div class="d-flex justify-content-center">
                <p class="text-white textJoueur1">Victoires Joueur 1 : </p>
                <span id="cptVictoireJoueur1" class="text-white"> </span>
            </div>
            <div class="d-flex justify-content-center">
                <p class="text-white textJoueur2">Victoires Joueur 2 : </p>
                <span id="cptVictoireJoueur2" class="text-white"> </span>
            </div>
        </div>
    </main>

    <script src="js/chifumi.js"></script>
</body>

</html>
